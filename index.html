<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-test de Gordon</title>
    <link rel="icon" href="/images/glass.svg">
    <link rel="stylesheet" href="/docs/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</script>
</head>
<body>
    <div class="container">
        <section id="step-login" class="screen">
            <h2>Bienvenue</h2>
            <p class="subtitle">Veuillez renseigner vos informations pour démarrer l'auto-test.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" required placeholder="Ex. Dupont">
                </div>
                <div class="input-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" required placeholder="Ex. Jean">
                </div>
                <div class="input-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" required placeholder="jean.dupont@example.com">
                </div>
                <button type="submit" class="btn">Commencer le test</button>
            </form>
        </section>

        <section id="step-quiz" class="screen hidden">
            <header>
                <h1>Auto-test de Gordon</h1>
                <p id="userInfo"></p>
                <p class="instructions">Répondez spontanément aux 60 affirmations ci-dessous.</p>
            </header>

            <form id="quizForm">
                <div id="questionsContainer"></div>
                <div class="actions">
                    <button type="submit" class="btn-submit">Valider et voir l'histogramme</button>
                </div>
            </form>
        </section>

        <section id="step-results" class="screen hidden">
    <h2>Résultats de votre évaluation</h2>
    
    <div class="chart-wrapper">
        <canvas id="histogramCanvas"></canvas>
    </div>

    <div id="scoresSummary" class="scores-grid"></div>

    <!-- Bloc de demande d'envoi par email -->
    <div id="emailConfirmationBlock" class="email-confirm-card">
        <p>Souhaitez-vous recevoir la synthèse de vos résultats par e-mail ?</p>
        <button id="btnSendEmail" class="btn-email">📧 Recevoir par e-mail</button>
        <p id="emailStatus" class="email-status"></p>
    </div>
</section>

    </div>

    <script src="script.js"></script>
</body>
</html>
